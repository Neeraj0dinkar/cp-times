<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CP Times | Latest India News</title><meta name="description" content="CP Times — fast, factual and fearless news from India and around the world."><link rel="canonical" href="https://cptimes.in/"><link rel="stylesheet" href="/styles.css"></head><body><header class="mast"><a href="/"><img src="/cv-news-logo.jpeg" alt="CP Times"></a><a href="/login">Newsroom Login</a></header><nav class="nav"><a href="/">HOME</a><a href="/category/india">INDIA</a><a href="/category/uttar-pradesh">UTTAR PRADESH</a><a href="/category/world">WORLD</a><a href="/category/business">BUSINESS</a><a href="/category/technology">TECHNOLOGY</a><a href="/category/sports">SPORTS</a><a href="/category/entertainment">ENTERTAINMENT</a></nav><div class="breaking"><strong>BREAKING</strong> <span id="b">Loading...</span></div><main class="container"><section id="hero" class="hero"><div><span class="tag">TOP STORY</span><h1>CP Times — your digital newsroom</h1><p>India, Uttar Pradesh, business, technology, sports and entertainment.</p></div></section><div class="layout"><section><h2>Latest News</h2><div id="list" class="news-list"></div></section><aside><div class="ad">ADVERTISEMENT</div><h2>CP Times on YouTube</h2><div id="yt"></div></aside></div></main><script>const e=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));async function go(){let [a,b,s]=await Promise.all([fetch("/api/articles?limit=12").then(r=>r.json()),fetch("/api/breaking").then(r=>r.json()),fetch("/api/settings").then(r=>r.json())]);if(b[0])document.getElementById("b").textContent=b[0].headline;list.innerHTML=(a||[]).map(x=>`<article class=card><a href="/${x.category.toLowerCase()}/${x.slug}"><img class=thumb src="${x.image_url||"/fallback-news.svg"}" alt=""></a><span class=tag>${e(x.category)}</span><h3><a href="/${x.category.toLowerCase()}/${x.slug}">${e(x.title)}</a></h3><p>${e(x.excerpt||"")}</p><span class=meta>${e(x.author_name||"CP Times Desk")} • ${new Date(x.published_at).toLocaleString("en-IN")}</span></article>`).join("")||"<p>No published stories yet.</p>";if(a[0]){hero.style.backgroundImage=`linear-gradient(0deg,rgba(0,0,0,.9),transparent),url("${a[0].image_url||"/fallback-news.svg"}")`;hero.querySelector("h1").textContent=a[0].title;hero.onclick=()=>location.href=`/${a[0].category.toLowerCase()}/${a[0].slug}`;hero.style.cursor="pointer"}if(s.youtube_featured_video)yt.innerHTML=`<iframe width="100%" height="220" src="https://www.youtube.com/embed/${encodeURIComponent(s.youtube_featured_video)}" frameborder="0" allowfullscreen></iframe>`}go();</script></body></html>
