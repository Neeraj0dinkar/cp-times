<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CP Times Newsroom</title><link rel="stylesheet" href="/styles.css"></head><body><header class="mast"><a href="/"><img src="/cv-news-logo.jpeg" alt="CP Times"></a><button id="logout" class="btn">Sign out</button></header><main class="container" style="padding:30px 0"><h1>CP Times Newsroom</h1><div id="msg"></div><div class="admin-grid"><section class="panel"><h2>Publish Article</h2><form id="articleForm"><input type="hidden" name="id"><label>Headline</label><input class="input" name="title" required><label>Category</label><select class="input" name="category"><option>India</option><option>Maharashtra</option><option>Pune</option><option>World</option><option>Business</option><option>Technology</option><option>Sports</option><option>Entertainment</option><option>Politics</option></select><label>Excerpt</label><textarea class="input" name="excerpt"></textarea><label>Article Body</label><textarea class="input" name="body" required></textarea><label>Author</label><input class="input" name="author_name" value="CP Times Desk"><label>Image</label><input id="img" type="file" accept="image/*"><label>Status</label><select class="input" name="status"><option>draft</option><option>review</option><option>published</option><option>archived</option></select><label><input name="featured" type="checkbox"> Featured</label><br><button class="btn red">Save Article</button></form></section><section class="panel"><h2>Published / Draft Stories</h2><table class="table"><thead><tr><th>Headline</th><th>Status</th><th>Edit</th></tr></thead><tbody id="rows"></tbody></table><hr><h2>Breaking News</h2><form id="bf"><input class="input" name="headline" placeholder="Breaking headline" required><button class="btn red">Add</button></form><div id="br"></div><hr><h2>Channel Settings</h2><form id="sf"><label>YouTube video ID</label><input class="input" name="youtube_featured_video" placeholder="YouTube video ID"><label>Ad code</label><textarea class="input" name="primary_ad_code"></textarea><button class="btn red">Save Settings</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let s,u,A=[];const $=x=>document.querySelector(x),msg=(x,c="notice")=>$("#msg").innerHTML=`<div class="notice ${c}">${x}</div>`,esc=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));async function init(){let c=await fetch("/api/config").then(r=>r.json());s=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);let {data:{session}}=await s.auth.getSession();if(!session)return location="/login";u=session.user;load()}async function load(){let {data,error}=await s.from("articles").select("*").order("created_at",{ascending:false});if(error)return msg(error.message,"err");A=data||[];rows.innerHTML=A.map(a=>`<tr><td>${esc(a.title)}<br><small>${esc(a.category)}</small></td><td>${a.status}</td><td><button class="btn" onclick="edit('${a.id}')">Edit</button></td></tr>`).join("");let {data:b}=await s.from("breaking_news").select("*").order("created_at",{ascending:false});br.innerHTML=(b||[]).map(x=>`<p>${esc(x.headline)} <button class=btn onclick="toggle('${x.id}',${!x.active})">${x.active?"Disable":"Enable"}</button></p>`).join("");let {data:z}=await s.from("site_settings").select("key,value");(z||[]).forEach(x=>{if(sf.elements[x.key])sf.elements[x.key].value=x.value||""})}window.edit=id=>{let a=A.find(x=>x.id===id);Object.keys(a).forEach(k=>{if(articleForm.elements[k])articleForm.elements[k].value=a[k]??""});articleForm.elements.featured.checked=!!a.featured;scrollTo(0,0)};articleForm.onsubmit=async e=>{e.preventDefault();try{let f=new FormData(articleForm),title=f.get("title"),slug=title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),image_url=null;if(img.files[0]){let file=img.files[0],p=`${u.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"")}`,up=await s.storage.from("article-images").upload(p,file,{contentType:file.type});if(up.error)throw up.error;image_url=s.storage.from("article-images").getPublicUrl(p).data.publicUrl}let row={title,slug,category:f.get("category"),excerpt:f.get("excerpt"),body:f.get("body"),author_name:f.get("author_name"),status:f.get("status"),featured:f.get("featured")==="on",updated_by:u.id};if(image_url)row.image_url=image_url;if(f.get("status")==="published")row.published_at=new Date().toISOString();let r=f.get("id")?await s.from("articles").update(row).eq("id",f.get("id")):await s.from("articles").insert({...row,created_by:u.id});if(r.error)throw r.error;msg("Article saved","ok");articleForm.reset();load()}catch(e){msg(e.message,"err")}};bf.onsubmit=async e=>{e.preventDefault();let f=new FormData(bf),r=await s.from("breaking_news").insert({headline:f.get("headline"),created_by:u.id});if(r.error)msg(r.error.message,"err");else{bf.reset();load()}};window.toggle=async(id,a)=>{await s.from("breaking_news").update({active:a}).eq("id",id);load()};sf.onsubmit=async e=>{e.preventDefault();let f=new FormData(sf);for(let [key,value] of f.entries())await s.from("site_settings").upsert({key,value});msg("Settings saved","ok")};logout.onclick=async()=>{await s.auth.signOut();location="/login"};init();
</script></body></html>
