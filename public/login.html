<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CP Times Admin Login</title><link rel="stylesheet" href="/styles.css"></head><body><header class="mast"><a href="/"><img src="/cv-news-logo.jpeg" alt="CP Times"></a></header><main class="login"><section class="panel" style="width:min(420px,92%)"><h1>CP Times Admin Login</h1><form id="f"><label>Email</label><input class="input" name="email" type="email" required><label>Password</label><input class="input" name="password" type="password" required><button class="btn red">Sign in</button></form><div id="m"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{let c=await fetch("/api/config").then(r=>r.json()),s=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);f.onsubmit=async e=>{e.preventDefault();let x=new FormData(f),{error}=await s.auth.signInWithPassword({email:x.get("email"),password:x.get("password")});if(error)m.innerHTML="<div class=notice>"+error.message+"</div>";else location="/admin"}})()</script></body></html>
