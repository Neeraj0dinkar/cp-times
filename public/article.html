<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CP Times Article</title><meta name="description" content="CP Times article"><link rel="stylesheet" href="styles.css"></head><body>
<div class="topline"><div class="container"><span>CP Times • India</span></div></div><header class="masthead"><div class="container mast"><a class="logo" href="/" aria-label="CP Times home"><img src="/cv-news-logo.jpeg" alt="CP Times logo"></a><a class="btn" href="/">← Home</a></div></header><nav class="nav"><div class="container"><a href="/">HOME</a><a href="/category.html?name=India">INDIA</a><a href="/category.html?name=World">WORLD</a><a href="/category.html?name=Business">BUSINESS</a><a href="/category.html?name=Technology">TECHNOLOGY</a><a href="/category.html?name=Sports">SPORTS</a></div></nav>
<main class="container article" id="article"></main><footer class="footer"><div class="container copyright">© 2026 CP Times</div></footer>
<script>
const slug=new URLSearchParams(location.search).get('slug');fetch('/api/articles/'+slug).then(r=>r.json()).then(a=>{document.title=a.title+' | CP Times';document.querySelector('meta[name="description"]').content=a.excerpt||a.title;document.getElementById('article').innerHTML=`<span class="category-label">${a.category}</span><h1>${a.title}</h1><p class="lead">${a.excerpt||''}</p><div class="article-meta">By <strong>${a.author}</strong> • ${new Date(a.publishedAt).toLocaleString('en-IN')}</div><div class="article-image"></div><div class="article-body"><p>${a.body}</p><p>CP Times will publish verified reporting, context and updates here. Replace this sample content through the CMS workflow before launch.</p></div>`;});
</script></body></html>
