<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CP Times Category</title><link rel="stylesheet" href="/styles.css"></head><body><header class="mast"><a href="/"><img src="/CP_Times_logo_New_transparent.png" alt="CP Times"></a></header><main class="container" style="padding:30px 0"><h1 id="h">News</h1><div id="l" class="news-list"></div></main><script>
const categoryMap = {
  "india": "India",
  "uttar-pradesh": "Uttar Pradesh",
  "world": "World",
  "business": "Business",
  "technology": "Technology",
  "sports": "Sports",
  "entertainment": "Entertainment",
  "politics": "Politics"
};

const categorySlug =
  location.pathname.split("/")[2] || "india";

const categoryName =
  categoryMap[categorySlug] ||
  categorySlug
    .replace(/-/g, " ")
    .replace(/\b\w/g, char => char.toUpperCase());

h.textContent =
  `${categoryName} News`;

const articleUrlKey = x => {

  const v =
    String(x && x.slug || "").trim();

  return v && v !== "%20"
    ? encodeURIComponent(v)
    : `id-${x.id}`;

};

const categoryUrlSlug = category => {

  return String(category || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "-");

};

fetch(
  "/api/articles?category=" +
  encodeURIComponent(categoryName)
)
  .then(r => r.json())
  .then(a => {

    l.innerHTML =
      (a || [])
        .map(x => `

          <article class="card">

            <a
              href="/${categoryUrlSlug(x.category)}/${articleUrlKey(x)}"
            >

              <img
                class="thumb"
                src="${x.image_url || "/fallback-news.svg"}"
              />

            </a>

            <span class="tag">
              ${x.category}
            </span>

            <h3>

              <a
                href="/${categoryUrlSlug(x.category)}/${articleUrlKey(x)}"
              >
                ${x.title}
              </a>

            </h3>

            <p>
              ${x.excerpt || ""}
            </p>

          </article>

        `)
        .join("") ||
      "<p>No stories yet.</p>";

  });
</script>
</body></html>
