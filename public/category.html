<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CP Times Category</title><link rel="stylesheet" href="/styles.css"></head><body><header class="mast"><a href="/"><img src="/cv-news-logo.jpeg" alt="CP Times"></a></header><main class="container" style="padding:30px 0"><h1 id="h">News</h1><div id="l" class="news-list"></div></main><script>let c=location.pathname.split("/")[2]||"india";h.textContent=c[0].toUpperCase()+c.slice(1)+" News";const articleUrlKey=x=>{const v=String(x&&x.slug||"").trim();return v&&v!=="%20"?encodeURIComponent(v):`id-${x.id}`};fetch("/api/articles?category="+encodeURIComponent(h.textContent.replace(" News",""))).then(r=>r.json()).then(a=>l.innerHTML=(a||[]).map(x=>`<article class=card><a href="/${x.category.toLowerCase()}/${articleUrlKey(x)}"><img class=thumb src="${x.image_url||"/fallback-news.svg"}"></a><span class=tag>${x.category}</span><h3><a href="/${x.category.toLowerCase()}/${articleUrlKey(x)}">${x.title}</a></h3><p>${x.excerpt||""}</p></article>`).join("")||"<p>No stories yet.</p>")</script></body></html>
