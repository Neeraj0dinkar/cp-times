<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CP Times Category</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="masthead"><div class="container mast"><a class="logo" href="/" aria-label="CP Times home"><img src="/cv-news-logo.jpeg" alt="CP Times logo"></a><a class="btn" href="/">Home</a></div></header><nav class="nav"><div class="container"><a href="/category.html?name=India">INDIA</a><a href="/category.html?name=World">WORLD</a><a href="/category.html?name=Business">BUSINESS</a><a href="/category.html?name=Technology">TECHNOLOGY</a><a href="/category.html?name=Sports">SPORTS</a><a href="/category.html?name=Entertainment">ENTERTAINMENT</a></div></nav>
<main class="container section"><div class="section-title"><h2 id="heading">News</h2></div><div class="news-list" id="list"></div></main><script>
const name=new URLSearchParams(location.search).get('name')||'India';document.getElementById('heading').textContent=name+' News';fetch('/api/articles?category='+encodeURIComponent(name)).then(r=>r.json()).then(d=>document.getElementById('list').innerHTML=d.map(a=>`<article class="news-card"><div class="thumb"></div><span class="category-label">${a.category}</span><h3><a href="/article.html?slug=${a.slug}">${a.title}</a></h3><p>${a.excerpt||''}</p><span class="meta">${a.author}</span></article>`).join('')||'<p>No stories published yet.</p>');
</script></body></html>
